name: Android release

# A push to main publishes the app as a GitHub Release tagged android-v<versionName>
# (title equal to the tag), which Obtainium tracks. A pull request that touches these
# paths builds the same APK as a workflow artifact without publishing.
on:
  push:
    branches: [main]
    paths:
      - android/**
      - .github/workflows/android-release.yml
  pull_request:
    paths:
      - android/**
      - .github/workflows/android-release.yml

permissions:
  contents: write

env:
  CERT_SHA256: f26ef81465ab9d517dd23444c5443f821f2de5ba68c958630ae9cc3ff3a44ad3

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4

      - name: Restore keystore
        env:
          KEYSTORE_B64: ${{ secrets.MARGIN_KEYSTORE_B64 }}
        run: |
          [ -n "$KEYSTORE_B64" ] || { echo "MARGIN_KEYSTORE_B64 is not set" >&2; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "MARGIN_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build
        working-directory: android
        env:
          MARGIN_KEYSTORE_PASSWORD: ${{ secrets.MARGIN_KEYSTORE_PASSWORD }}
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew --no-daemon testDebugUnitTest assembleRelease --console=plain

      - name: Check the signer and name the APK
        id: apk
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$bt/apksigner" verify --print-certs "$apk" | grep -q "SHA-256 digest: $CERT_SHA256" \
            || { echo "APK is not signed with the Margin release key" >&2; exit 1; }
          version=$("$bt/aapt2" dump badging "$apk" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          mkdir -p dist
          cp "$apk" "dist/margin-$version.apk"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: margin-${{ steps.apk.outputs.version }}
          path: dist/*.apk
          retention-days: 7

      - name: Publish release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.apk.outputs.version }}
        run: |
          gh release create "android-v$VERSION" "dist/margin-$VERSION.apk" \
            --target "$GITHUB_SHA" --title "android-v$VERSION" --notes "Android build of $GITHUB_SHA."
